name: Aide Bot CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q main.py aidebot
      - name: Full test suite
        run: python -m pytest -q
      - name: Concurrency stress gate
        run: |
          for run in 1 2 3; do
            echo "Concurrency stress pass ${run}/3"
            python -m pytest -q tests/test_concurrency_stress.py
          done
